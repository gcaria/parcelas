name: Run Los Lagos and Aysen five-year Sentinel pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: southern-five-year-sentinel
  cancel-in-progress: false

env:
  START_YEAR: "2020"
  END_YEAR: "2024"
  OUTPUT_PREFIX: gs://parcelas-wrs2/previews/sentinel2-2020-2024
  CHECKPOINT_PREFIX: gs://parcelas-wrs2/checkpoints/sentinel2-multiyear
  METRIC_VERSION: daily-v1

jobs:
  process-tile:
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        tile:
          - T18FVL
          - T18FVM
          - T18FWL
          - T18FWM
          - T18FXL
          - T18FXM
          - T18FYM
          - T18GVN
          - T18GVP
          - T18GVQ
          - T18GWN
          - T18GWP
          - T18GWQ
          - T18GWR
          - T18GWS
          - T18GXN
          - T18GXP
          - T18GXQ
          - T18GXR
          - T18GXS
          - T18GXT
          - T18GXU
          - T18GYN
          - T18GYP
          - T18GYQ
          - T18GYR
          - T18GYS
          - T18GYT
          - T18GYU
          - T19GBP
          - T19GCK
          - T19GCL
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TILE_ID: ${{ matrix.tile }}
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Check for an existing result
        id: existing
        run: |
          tile_key="${TILE_ID#T}"
          final_url="$OUTPUT_PREFIX/sentinel2_${tile_key}_uint8.tif"
          if gcloud storage ls "$final_url.$METRIC_VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already completed: $final_url"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        if: steps.existing.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libspatialindex-dev --no-install-recommends
      - uses: actions/setup-python@v6
        if: steps.existing.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pipeline dependencies
        if: steps.existing.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Process five years sequentially
        if: steps.existing.outputs.skip != 'true'
        run: |
          mkdir -p output annual-counts
          python -m data_pipeline.run_multiyear \
            --tile-id "$TILE_ID" \
            --start-year "$START_YEAR" \
            --end-year "$END_YEAR" \
            --output "output/result.tif" \
            --work-dir annual-counts \
            --buffer -500 \
            --checkpoint-prefix "$CHECKPOINT_PREFIX/sentinel2_${TILE_ID}_${START_YEAR}_${END_YEAR}"

      - name: Publish completed tile
        if: steps.existing.outputs.skip != 'true'
        run: |
          tile_key="${TILE_ID#T}"
          final_url="$OUTPUT_PREFIX/sentinel2_${tile_key}_uint8.tif"
          gcloud storage cp output/result.tif "$final_url"
          printf '%s\n' "$METRIC_VERSION" > output/metric-version.txt
          gcloud storage cp output/metric-version.txt "$final_url.$METRIC_VERSION"
