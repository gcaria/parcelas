name: Run regional five-year Sentinel pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regional-five-year-sentinel
  cancel-in-progress: false

env:
  START_YEAR: "2020"
  END_YEAR: "2024"
  OUTPUT_PREFIX: gs://parcelas-wrs2/previews/sentinel2-2020-2024
  CHECKPOINT_PREFIX: gs://parcelas-wrs2/checkpoints/sentinel2-multiyear

jobs:
  seed-completed-tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Seed existing five-year results
        run: |
          gcloud storage cp \
            gs://parcelas-wrs2/comparisons/sentinel2-multiyear/run-32605305763/sentinel2_T19HCD_2020_2024_uint8.tif \
            "$OUTPUT_PREFIX/sentinel2_19HCD_uint8.tif"
          gcloud storage cp \
            gs://parcelas-wrs2/cloud-run-results/sentinel2_T19HCC_2020_2024_uint8.tif \
            "$OUTPUT_PREFIX/sentinel2_19HCC_uint8.tif"
          python -m data_pipeline.create_progressive_mosaic \
            --input-pattern "$OUTPUT_PREFIX/sentinel2_*_uint8.tif" \
            --all-matches \
            --output "$OUTPUT_PREFIX/mosaic.json.gz"

  process-tile:
    needs: seed-completed-tiles
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tile:
          - T18HWC
          - T18HXB
          - T18HXC
          - T18HXD
          - T18HXE
          - T18HXF
          - T18HYB
          - T18HYC
          - T18HYD
          - T18HYE
          - T18HYF
          - T18HYG
          - T18HYH
          - T19HBA
          - T19HBB
          - T19HBC
          - T19HBD
          - T19HBS
          - T19HBT
          - T19HBU
          - T19HBV
          - T19HCA
          - T19HCB
          - T19HCS
          - T19HCT
          - T19HCU
          - T19HCV
          - T19HDB
          - T19HDC
          - T19HDD
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TILE_ID: ${{ matrix.tile }}
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Check for an existing result
        id: existing
        run: |
          tile_key="${TILE_ID#T}"
          final_url="$OUTPUT_PREFIX/sentinel2_${tile_key}_uint8.tif"
          if gcloud storage ls "$final_url" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already completed: $final_url"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        if: steps.existing.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libspatialindex-dev --no-install-recommends
      - uses: actions/setup-python@v6
        if: steps.existing.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pipeline dependencies
        if: steps.existing.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Process five years sequentially
        if: steps.existing.outputs.skip != 'true'
        run: |
          mkdir -p output annual-counts
          python -m data_pipeline.run_multiyear \
            --tile-id "$TILE_ID" \
            --start-year "$START_YEAR" \
            --end-year "$END_YEAR" \
            --output "output/result.tif" \
            --work-dir annual-counts \
            --buffer -500 \
            --checkpoint-prefix "$CHECKPOINT_PREFIX/sentinel2_${TILE_ID}_${START_YEAR}_${END_YEAR}"

      - name: Publish completed tile
        if: steps.existing.outputs.skip != 'true'
        run: |
          tile_key="${TILE_ID#T}"
          gcloud storage cp output/result.tif "$OUTPUT_PREFIX/sentinel2_${tile_key}_uint8.tif"

      - name: Install mosaic dependencies
        run: pip install -r api/requirements.txt
      - name: Publish all completed tiles to the frontend
        run: |
          python -m data_pipeline.create_progressive_mosaic \
            --input-pattern "$OUTPUT_PREFIX/sentinel2_*_uint8.tif" \
            --all-matches \
            --output "$OUTPUT_PREFIX/mosaic.json.gz"
