<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Parcelas - Chile's Yearly Clear Sky Percentage</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="map"></div>
    <div id="debug">
      <strong>Debug Log (Press '?' to toggle)</strong>
      <div id="debug-content"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="config.js"></script>
    <script>
      // --- Debug Logger ---
      const debugLog = (msg, type = "info") => {
        console.log(`[${type.toUpperCase()}]`, msg);
        const debugContent = document.getElementById("debug-content");
        const timestamp = new Date().toLocaleTimeString();
        const line = document.createElement("div");
        line.className = type;
        line.textContent = `[${timestamp}] ${msg}`;
        debugContent.appendChild(line);
        debugContent.scrollTop = debugContent.scrollHeight;
      };

      // Toggle debug panel with '?' key
      document.addEventListener("keydown", (e) => {
        if (e.key === "?") {
          document.getElementById("debug").classList.toggle("visible");
        }
      });

      // Detect environment
      const isLocal =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1";

      const API_BASE_URL = isLocal
        ? "http://localhost:8080"
        : "https://parcelas-api-228350087170.us-central1.run.app";
      const DEFAULT_MOSAIC_URLS = {
        landsat: "gs://parcelas-wrs2/mosaics/mosaic_masked.json.gz",
        sentinel2:
          "gs://parcelas-wrs2/previews/progressive/sentinel2-2020.json.gz",
        sentinel2_2020_2024:
          "gs://parcelas-wrs2/previews/sentinel2-2020-2024/mosaic.json.gz",
      };
      const MOSAIC_URLS =
        typeof SENSOR_MOSAIC_URLS !== "undefined"
          ? { ...SENSOR_MOSAIC_URLS }
          : DEFAULT_MOSAIC_URLS;
      const queryParams = new URLSearchParams(window.location.search);
      const requestedSensor = queryParams.get("sensor");
      const previewMosaicUrl = queryParams.get("mosaic");
      const configuredDefaultSensor =
        typeof DEFAULT_SENSOR !== "undefined" ? DEFAULT_SENSOR : "landsat";
      const DEFAULT_SELECTED_SENSOR = Object.hasOwn(MOSAIC_URLS, requestedSensor)
        ? requestedSensor
        : configuredDefaultSensor;
      if (previewMosaicUrl) {
        MOSAIC_URLS[DEFAULT_SELECTED_SENSOR] = previewMosaicUrl;
      }
      const SENSOR_LABELS = {
        landsat: "Landsat",
        sentinel2: "Sentinel-2",
        sentinel2_2020_2024: "Sentinel-2 (2020–2024)",
      };
      const ZOOM_ON_SELECT = new Set(["sentinel2_2020_2024"]);
      const CLEAR_SKY_COLORS = [
        [59, 76, 192, 255],
        [68, 90, 204, 255],
        [88, 117, 214, 255],
        [120, 145, 220, 255],
        [157, 170, 225, 255],
        [192, 192, 192, 255],
        [224, 162, 141, 255],
        [215, 111, 89, 255],
        [192, 62, 56, 255],
        [127, 3, 3, 255],
      ];
      // TiTiler applies the colormap after rescaling 0–100 into an 8-bit
      // render range, so map all 256 rendered values into the ten classes.
      const DISCRETE_COLORMAP = Object.fromEntries(
        Array.from({ length: 256 }, (_, value) => [
          value,
          CLEAR_SKY_COLORS[Math.min(Math.floor((value * 10) / 256), 9)],
        ]),
      );

      debugLog(`Environment: ${isLocal ? "LOCAL" : "PRODUCTION"}`, "info");
      debugLog(`API Base URL: ${API_BASE_URL}`, "info");
      debugLog(`Hostname: ${window.location.hostname}`, "info");

      // Test API connectivity
      const testAPI = async () => {
        debugLog("Testing API connectivity...", "info");
        try {
          const response = await fetch(`${API_BASE_URL}/health`);
          if (response.ok) {
            const data = await response.json();
            debugLog(`API health check: ${JSON.stringify(data)}`, "success");
          } else {
            debugLog(
              `API health check failed: ${response.status} ${response.statusText}`,
              "error",
            );
          }
        } catch (err) {
          debugLog(`API health check error: ${err.message}`, "error");
          if (err.message.includes("blocked")) {
            debugLog("Request may be blocked by ad blocker or CORS", "error");
          }
        }
      };

      testAPI();

      // --- Colorbar as a Leaflet Control ---
      const ColorBar = L.Control.extend({
        options: {
          position: "bottomright",
        },
        onAdd: function () {
          const container = L.DomUtil.create("div", "leaflet-colorbar");

          const title = L.DomUtil.create("div", "colorbar-title");
          title.textContent = "Clear Sky Days (%)";
          title.style.cssText =
            "font-size:12px; font-family:sans-serif; color:#333; margin-bottom:5px; font-weight:bold; text-align:center; width:180px;";
          container.appendChild(title);

          const gradient = L.DomUtil.create("div", "colorbar-gradient");
          CLEAR_SKY_COLORS.forEach(([red, green, blue]) => {
            const step = L.DomUtil.create("div", "colorbar-step", gradient);
            step.style.backgroundColor = `rgb(${red}, ${green}, ${blue})`;
          });
          container.appendChild(gradient);

          const labels = L.DomUtil.create("div", "colorbar-labels");
          Array.from({ length: 11 }, (_, index) => index * 10).forEach(function (
            val,
          ) {
            const span = document.createElement("span");
            span.textContent = val;
            labels.appendChild(span);
          });
          container.appendChild(labels);
          return container;
        },
      });

      // --- GitHub Link Control ---
      const GitHubLink = L.Control.extend({
        options: {
          position: "bottomleft",
        },
        onAdd: function () {
          const container = L.DomUtil.create("div", "leaflet-github");
          container.innerHTML = `
            <a href="https://github.com/gcaria/parcelas" target="_blank" rel="noopener noreferrer">
              <svg height="16" width="16" viewBox="0 0 16 16" style="vertical-align:middle; margin-right:5px;">
                <path fill="#333" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
                  0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52
                  -.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2
                  -3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82
                  .64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08
                  2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
                  1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
              </svg>
              View on GitHub
            </a>
          `;
          return container;
        },
      });

      // --- Sensor Selector Control ---
      const SensorSelector = L.Control.extend({
        options: {
          position: "topleft",
        },
        onAdd: function () {
          const container = L.DomUtil.create("div", "leaflet-sensor-selector");
          const label = L.DomUtil.create("label", "", container);
          label.setAttribute("for", "sensor-select");
          label.textContent = "Sensor";

          const select = L.DomUtil.create("select", "", container);
          select.id = "sensor-select";

          Object.keys(MOSAIC_URLS).forEach((sensor) => {
            const option = document.createElement("option");
            option.value = sensor;
            option.textContent = SENSOR_LABELS[sensor] || sensor;
            option.selected = sensor === DEFAULT_SELECTED_SENSOR;
            select.appendChild(option);
          });

          L.DomEvent.disableClickPropagation(container);
          L.DomEvent.disableScrollPropagation(container);
          select.addEventListener("change", async (event) => {
            const sensor = event.target.value;
            if (ZOOM_ON_SELECT.has(sensor)) {
              await zoomToMosaic(MOSAIC_URLS[sensor]);
            }
            setSensor(sensor);
          });

          return container;
        },
      });

      // --- Mouse Position Value Control ---
      let positionValuesEnabled = false;
      let positionValueTooltip = null;
      let positionValueTimer = null;
      let positionValueRequest = null;
      let selectedSensor = DEFAULT_SELECTED_SENSOR;

      const PositionValue = L.Control.extend({
        options: {
          position: "topleft",
        },
        onAdd: function () {
          const container = L.DomUtil.create("div", "leaflet-position-value");
          const label = L.DomUtil.create("label", "", container);
          const checkbox = L.DomUtil.create("input", "", label);
          checkbox.type = "checkbox";
          label.appendChild(document.createTextNode("Show position value"));

          L.DomEvent.disableClickPropagation(container);
          L.DomEvent.disableScrollPropagation(container);
          checkbox.addEventListener("change", () => {
            positionValuesEnabled = checkbox.checked;
            clearTimeout(positionValueTimer);
            positionValueRequest?.abort();
            positionValueRequest = null;
            if (!positionValuesEnabled && positionValueTooltip) {
              map.removeLayer(positionValueTooltip);
            }
          });

          return container;
        },
      });

      // --- Create map ---
      debugLog("Initializing map...", "info");
      const map = L.map("map").setView([-35.675, -71.543], 5);
      map.createPane("clearSkyPane");
      map.getPane("clearSkyPane").style.zIndex = 450;
      map.getPane("clearSkyPane").style.pointerEvents = "none";

      // Basemap
      debugLog("Adding basemap layer...", "info");
      const streetBasemap = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          attribution: "© OpenStreetMap contributors",
        },
      ).addTo(map);

      const satelliteBasemap = L.tileLayer(
        "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
          attribution:
            "Sources: Esri, Maxar, Earthstar Geographics, and the GIS User Community",
          maxZoom: 19,
        },
      );

      const layerControl = L.control
        .layers(
          {
            Streets: streetBasemap,
            Satellite: satelliteBasemap,
          },
          null,
          { position: "topright", collapsed: false },
        )
        .addTo(map);

      [streetBasemap, satelliteBasemap].forEach((layer) => {
        layer.on("load", () =>
          debugLog("Basemap loaded successfully", "success"),
        );
        layer.on("tileerror", (e) =>
          debugLog(`Basemap tile error: ${e.tile.src}`, "error"),
        );
      });

      const buildTileUrl = (mosaicUrl) =>
        `${API_BASE_URL}/mosaicjson/tiles/WebMercatorQuad/{z}/{x}/{y}.png` +
        `?url=${encodeURIComponent(mosaicUrl)}` +
        "&rescale=0,100" +
        `&colormap=${encodeURIComponent(JSON.stringify(DISCRETE_COLORMAP))}` +
        "&clamp=true";

      // Track tile loading
      let tilesLoaded = 0;
      let tilesErrored = 0;
      let mosaicLayer = null;

      const attachMosaicLayerEvents = (layer) => {
        layer.on("tileloadstart", (e) => {
          debugLog(`Loading tile: ${e.url}`, "info");
        });

        layer.on("tileload", () => {
          tilesLoaded++;
          debugLog(`Tile loaded successfully (${tilesLoaded} total)`, "success");
        });

        layer.on("tileerror", (e) => {
          tilesErrored++;
          debugLog(`Tile error (${tilesErrored} total): ${e.tile.src}`, "error");
          debugLog(
            `Error coords: z=${e.coords.z}, x=${e.coords.x}, y=${e.coords.y}`,
            "error",
          );
        });

        layer.on("loading", () =>
          debugLog("Mosaic layer loading...", "info"),
        );
        layer.on("load", () =>
          debugLog("Mosaic layer load complete", "success"),
        );
      };

      const setSensor = (sensor) => {
        const mosaicUrl = MOSAIC_URLS[sensor];
        if (!mosaicUrl) {
          debugLog(`No mosaic URL configured for sensor: ${sensor}`, "error");
          return;
        }

        selectedSensor = sensor;
        positionValueRequest?.abort();
        if (positionValueTooltip) {
          positionValueTooltip.setContent("Clear Sky Days (%): …");
        }

        const dataIsVisible = mosaicLayer ? map.hasLayer(mosaicLayer) : true;
        if (mosaicLayer) {
          map.removeLayer(mosaicLayer);
          layerControl.removeLayer(mosaicLayer);
        }

        tilesLoaded = 0;
        tilesErrored = 0;
        const tileUrl = buildTileUrl(mosaicUrl);
        debugLog(`Selected sensor: ${SENSOR_LABELS[sensor] || sensor}`, "info");
        debugLog(`Mosaic URL: ${mosaicUrl}`, "info");
        debugLog(`Tile URL template: ${tileUrl}`, "info");

        mosaicLayer = L.tileLayer(tileUrl, {
          tileSize: 256,
          opacity: 0.8,
          pane: "clearSkyPane",
          updateWhenZooming: false,
          keepBuffer: 0,
        });
        attachMosaicLayerEvents(mosaicLayer);
        layerControl.addOverlay(mosaicLayer, "Clear-sky data");
        if (dataIsVisible) {
          mosaicLayer.addTo(map);
        }
      };

      const zoomToMosaic = async (mosaicUrl) => {
        const infoUrl =
          `${API_BASE_URL}/mosaicjson/info` +
          `?url=${encodeURIComponent(mosaicUrl)}`;

        try {
          const response = await fetch(infoUrl);
          if (!response.ok) {
            throw new Error(`Mosaic info request failed: ${response.status}`);
          }

          const info = await response.json();
          const [west, south, east, north] = info.bounds;
          const bounds = L.latLngBounds([south, west], [north, east]);
          map.fitBounds(bounds, { padding: [20, 20] });
          if (info.mosaic_minzoom && map.getZoom() < info.mosaic_minzoom) {
            map.setZoom(info.mosaic_minzoom);
          }
          debugLog(`Zoomed to preview bounds: ${info.bounds}`, "success");
        } catch (error) {
          debugLog(`Unable to zoom to preview: ${error.message}`, "error");
        }
      };

      debugLog("Adding colorbar control...", "info");
      new ColorBar().addTo(map);

      debugLog("Adding sensor selector...", "info");
      new SensorSelector().addTo(map);
      new PositionValue().addTo(map);
      const initializeMosaic = async () => {
        // Position the map before adding a preview layer. Adding it first makes
        // Leaflet request tiles for every intermediate zoom level.
        if (previewMosaicUrl || ZOOM_ON_SELECT.has(DEFAULT_SELECTED_SENSOR)) {
          await zoomToMosaic(MOSAIC_URLS[DEFAULT_SELECTED_SENSOR]);
        }
        setSensor(DEFAULT_SELECTED_SENSOR);
      };
      initializeMosaic();

      debugLog("Adding github link...", "info");
      new GitHubLink().addTo(map);

      // Log map events
      map.on("zoomend", () => debugLog(`Zoom level: ${map.getZoom()}`, "info"));
      map.on("moveend", () => {
        const center = map.getCenter();
        debugLog(
          `Map center: [${center.lat.toFixed(4)}, ${center.lng.toFixed(4)}]`,
          "info",
        );
      });

      const pointValue = (data) => {
        if (Array.isArray(data.assets)) {
          return data.assets[0]?.values?.[0];
        }
        if (Array.isArray(data.values)) {
          const first = data.values[0];
          return Array.isArray(first) && Array.isArray(first[1])
            ? first[1][0]
            : first;
        }
        return null;
      };

      const updatePositionValue = async (latlng) => {
        positionValueRequest?.abort();
        positionValueRequest = new AbortController();
        const mosaicUrl = MOSAIC_URLS[selectedSensor];
        const pointUrl =
          `${API_BASE_URL}/mosaicjson/point/${latlng.lng},${latlng.lat}` +
          `?url=${encodeURIComponent(mosaicUrl)}`;

        try {
          const response = await fetch(pointUrl, {
            signal: positionValueRequest.signal,
          });
          if (!response.ok) {
            throw new Error(`Point request failed: ${response.status}`);
          }
          const value = pointValue(await response.json());
          positionValueTooltip.setContent(
            value == null
              ? "Clear Sky Days (%): no data"
              : `Clear Sky Days (%): ${Math.round(value)}`,
          );
        } catch (error) {
          if (error.name !== "AbortError") {
            positionValueTooltip.setContent("Clear Sky Days (%): unavailable");
            debugLog(`Point value error: ${error.message}`, "error");
          }
        }
      };

      map.on("mousemove", (event) => {
        if (!positionValuesEnabled || !mosaicLayer || !map.hasLayer(mosaicLayer)) {
          return;
        }
        positionValueRequest?.abort();
        clearTimeout(positionValueTimer);
        if (!positionValueTooltip) {
          positionValueTooltip = L.tooltip({
            permanent: true,
            direction: "right",
            offset: [12, 0],
            className: "leaflet-position-value-tooltip",
          });
        }
        positionValueTooltip
          .setLatLng(event.latlng)
          .setContent("Clear Sky Days (%): …")
          .addTo(map);
        positionValueTimer = setTimeout(
          () => updatePositionValue(event.latlng),
          250,
        );
      });

      map.getContainer().addEventListener("mouseleave", () => {
        clearTimeout(positionValueTimer);
        positionValueRequest?.abort();
        if (positionValueTooltip) {
          map.removeLayer(positionValueTooltip);
        }
      });

      // Catch global errors
      window.addEventListener("error", (e) => {
        debugLog(`Global error: ${e.message}`, "error");
      });

      debugLog("Map initialization complete", "success");
      debugLog("Press ? to toggle this debug panel", "info");
    </script>
  </body>
</html>
